<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA tool</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <!-- 배포할 때마다 v 값을 바꾼다. 브라우저가 예전 css·js를 새 html과 섞어 쓰지 않게 한다. -->
  <link rel="stylesheet" href="style.css?v=2026110704">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="logo">
        <span class="logo-mark">QA</span>
        <span class="logo-text">QA tool</span>
      </div>
      <nav id="tool-nav" class="tool-nav" hidden>
        <button type="button" class="tool-link" data-tool="phrases">문구 보관함</button>
        <button type="button" class="tool-link" data-tool="deploy">별도배포확인</button>
      </nav>
      <div id="account" class="account" hidden>
        <span id="account-email" class="account-email"></span>
        <button type="button" id="logout-button" class="logout-button">로그아웃</button>
      </div>
    </div>
  </header>

  <main id="login-view" class="page page-login" hidden>
    <section class="card">
      <h2>로그인</h2>
      <form id="login-form" class="login-form">
        <label for="login-email" class="field-label">이메일</label>
        <input id="login-email" type="email" autocomplete="username" required>
        <label for="login-password" class="field-label">비밀번호</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
        <div class="form-footer">
          <p id="login-message" class="message" role="status"></p>
          <button type="submit" class="button-primary">로그인</button>
        </div>
      </form>
    </section>
  </main>

  <main id="app-view" class="page" hidden>
    <section class="library">
      <div class="library-header">
        <div id="folder-tabs" class="folder-tabs"></div>
        <button type="button" id="new-phrase-button" class="new-phrase-button">+ 새 문구</button>
      </div>

      <div class="shortcuts">
        <span class="shortcut"><kbd>1–9</kbd>바로 복사</span>
        <span class="shortcut"><kbd>↑ ↓</kbd>선택</span>
        <span class="shortcut"><kbd>Enter</kbd>선택 문구 복사</span>
        <span class="shortcut"><kbd>N</kbd>새 문구</span>
        <span class="shortcut"><kbd>⋮⋮</kbd>끌어서 순서 변경 · 탭 위에 놓으면 폴더에 추가 · 탭 더블클릭으로 이름 변경</span>
      </div>

      <p id="list-message" class="empty" role="status" hidden></p>
      <ul id="phrase-list" class="phrase-list"></ul>
    </section>
  </main>

  <main id="deploy-view" class="page" hidden>
    <section class="library">
      <div class="library-header">
        <div id="deploy-tabs" class="folder-tabs"></div>
      </div>
      <p id="deploy-progress" class="deploy-progress" hidden></p>
      <p id="deploy-message" class="empty" role="status" hidden></p>
      <div id="deploy-grid" class="deploy-grid" hidden>
        <div class="deploy-scroll">
          <table class="deploy-table">
            <colgroup>
              <col class="col-handle">
              <col class="col-qc">
              <col class="col-job">
              <col class="col-dev">
              <col class="col-types">
              <col>
              <col class="col-check">
              <col class="col-check">
              <col class="col-delete">
            </colgroup>
            <thead>
              <tr>
                <th></th>
                <th>QC</th>
                <th>잡코드</th>
                <th>개발자</th>
                <th>파일유형</th>
                <th>특이사항</th>
                <th class="is-center">푸시</th>
                <th class="is-center">QC확인</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="deploy-rows"></tbody>
          </table>
        </div>
        <button type="button" id="deploy-add-row" class="deploy-add-row">+ 새 행</button>
      </div>
    </section>
  </main>

  <div id="editor-overlay" class="modal-overlay" hidden>
    <form id="editor-form" class="modal" role="dialog" aria-modal="true" aria-labelledby="editor-heading" novalidate>
      <h2 id="editor-heading" class="modal-title">새 문구</h2>
      <label class="field">제목
        <input id="editor-title" type="text" maxlength="100" placeholder="목록에 보일 제목">
      </label>
      <fieldset class="field folder-field">
        <legend>폴더 <span class="field-note">여러 개 고를 수 있습니다</span></legend>
        <div id="editor-folders" class="folder-checks"></div>
      </fieldset>
      <label id="editor-text-field" class="field">내용
        <textarea id="editor-text" rows="6" placeholder="자주 쓰는 문구를 입력하세요"></textarea>
      </label>
      <div class="modal-footer">
        <p id="editor-message" class="modal-message" role="status" hidden></p>
        <span id="editor-hint" class="modal-hint">Ctrl+Enter 저장 · Esc 닫기</span>
        <button type="submit" id="editor-save" class="button-primary modal-save">저장</button>
        <button type="button" id="editor-cancel" class="button-secondary modal-cancel">취소</button>
      </div>
    </form>
  </div>

  <div id="folder-delete-overlay" class="modal-overlay" hidden>
    <div class="modal modal-small" role="alertdialog" aria-modal="true" aria-labelledby="folder-delete-heading" aria-describedby="folder-delete-body">
      <h2 id="folder-delete-heading" class="modal-title"></h2>
      <div id="folder-delete-body" class="modal-body"></div>
      <div class="modal-footer">
        <p id="folder-delete-message" class="modal-message" role="status" hidden></p>
        <button type="button" id="folder-delete-with-phrases" class="button-danger modal-danger">문구도 함께 삭제</button>
        <button type="button" id="folder-delete-only" class="button-primary modal-save">폴더만 삭제</button>
        <button type="button" id="folder-delete-cancel" class="button-secondary modal-cancel">취소</button>
      </div>
    </div>
  </div>

  <div id="deploy-folder-delete-overlay" class="modal-overlay" hidden>
    <div class="modal modal-small" role="alertdialog" aria-modal="true" aria-labelledby="deploy-folder-delete-heading" aria-describedby="deploy-folder-delete-body">
      <h2 id="deploy-folder-delete-heading" class="modal-title"></h2>
      <div id="deploy-folder-delete-body" class="modal-body"></div>
      <div class="modal-footer">
        <p id="deploy-folder-delete-message" class="modal-message" role="status" hidden></p>
        <button type="button" id="deploy-folder-delete-confirm" class="button-danger modal-danger modal-save">삭제</button>
        <button type="button" id="deploy-folder-delete-cancel" class="button-secondary modal-cancel">취소</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js" integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp" crossorigin="anonymous"></script>
  <script src="app.js?v=2026110704"></script>
  <script src="deploy.js?v=2026110704"></script>
</body>
</html>
