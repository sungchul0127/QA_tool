<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA 툴</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>QA 툴</h1>
    <button type="button" id="logout-button" hidden>로그아웃</button>
  </header>

  <main id="login-view" class="container" hidden>
    <section class="card">
      <h2>로그인</h2>
      <form id="login-form" class="login-form">
        <label for="login-email">이메일</label>
        <input id="login-email" type="email" autocomplete="username" required>
        <label for="login-password">비밀번호</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
        <div class="form-footer">
          <p id="login-message" class="message" role="status"></p>
          <button type="submit" class="button-primary">로그인</button>
        </div>
      </form>
    </section>
  </main>

  <main id="app-view" class="container" hidden>
    <section class="card">
      <h2>문구 등록</h2>
      <form id="phrase-form">
        <label for="phrase-input" class="sr-only">등록할 문구</label>
        <textarea id="phrase-input" rows="4" placeholder="자주 쓰는 문구를 입력하세요"></textarea>
        <div class="form-footer">
          <p id="form-message" class="message" role="status"></p>
          <button type="submit" class="button-primary">등록</button>
        </div>
      </form>
    </section>

    <section>
      <h2>등록된 문구</h2>
      <p id="list-message" class="empty" role="status"></p>
      <ul id="phrase-list" class="phrase-list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js" integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
